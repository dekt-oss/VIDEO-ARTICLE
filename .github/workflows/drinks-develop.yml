# 주류 소재 자동 개발 워커 (2026-10-30). docs/deviation-drinks-develop.md
#
# 운영자가 소재 화면에서 [근거 초안 만들기]·[제작안 초안 만들기]를 누르면 요청이 큐(drink_develop_requests)에 쌓인다.
# 대시보드가 GITHUB_DISPATCH_TOKEN 이 있으면 이 워크플로를 바로 깨우고(workflow_dispatch), 없으면 Actions 탭에서 손으로 돌린다.
# 예약 실행(cron)은 없다 — 모델 호출은 운영자가 연 개발 결재(예산) 안에서만, 요청이 있을 때만 일어난다.
# ★ 모델을 부르는 키(DEEPSEEK·GEMINI)는 있지만, 결재가 없는 요청은 호출 전에 budget_missing 으로 멈춘다(DB 가 상한도 센다).
# ★ Europe PMC 는 켜지 않는다(DRINKS_DEVELOP_EUROPEPMC_ENABLED 기본 꺼짐 — 약관 미확인). 공식 출처 목록은 config 에 비어 있다.
# ★ 0단계는 Jev 를 끈다(JEV_ENABLED=0). 켜려면 JEV_ENABLED=1 과 DRINKS_DEVELOP_JEV_ENABLED=1 을 둘 다 준다.
name: drinks-develop

on:
  workflow_dispatch:

concurrency:
  group: drinks-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      JEV_ENABLED: "0"
      TIMEZONE: "Asia/Seoul"
      WORKER_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r engine/requirements.txt
      - name: develop
        run: python -m engine.drinks_develop
