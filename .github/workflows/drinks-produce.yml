# 주류 공장 C단계 제작 워커 (2026-10-23). docs/deviation-drinks-production.md
#
# 대시보드 [렌더 요청] 이 큐에 작업을 넣고 이 워크플로를 깨운다(GITHUB_DISPATCH_TOKEN 이 있으면). 예약 실행은 없다.
# ★ 무료 제작: 로컬 카드·ffmpeg 또는 째리 HyperFrames, 음성은 Edge TTS. 이 워크플로에 유료 생성 키는 없다.
# ★ 파일은 비공개 버킷 'drinks' 의 drinks/{job}/… 에만 올린다(논문·리포트 정리 경로가 걷지 않는 접두어).
name: drinks-produce

on:
  workflow_dispatch:

concurrency:
  group: drinks-produce
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIMEZONE: "Asia/Seoul"
      WORKER_ID: ${{ github.run_id }}
      DRINKS_STORAGE: supabase
      DRINKS_TTS: edge
      IMAGE_PROVIDER: reuse
      VIDEO_PROVIDER: placeholder
      TTS_PROVIDER: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk
      - run: python -m pip install -r engine/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        continue-on-error: true
        timeout-minutes: 4
        with:
          node-version: "22"
      - name: Prepare Jjeri HyperFrames and Chromium
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m engine.motion.jjeri_class.hf_env npx --yes hyperframes@0.9.72 --version
          python -m engine.motion.jjeri_class.hf_env npx --yes hyperframes@0.9.72 browser ensure
      - name: produce
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m engine.drinks_produce
