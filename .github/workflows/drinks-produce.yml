# 주류 공장 C단계 제작 워커 (2026-10-23). docs/deviation-drinks-production.md
#
# 대시보드 [렌더 요청] 이 큐에 작업을 넣고 이 워크플로를 깨운다(GITHUB_DISPATCH_TOKEN 이 있으면). 예약 실행은 없다.
# ★ 유료 호출 없음: 대체 이미지(로컬 장면 카드) + 무료 TTS(edge) + ffmpeg. LLM·이미지·영상 생성 키를 주지 않는다.
# ★ 파일은 비공개 버킷 'drinks' 의 drinks/{job}/… 에만 올린다(논문·리포트 정리 경로가 걷지 않는 접두어).
name: drinks-produce

on:
  workflow_dispatch:

concurrency:
  group: drinks-produce
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TIMEZONE: "Asia/Seoul"
      WORKER_ID: ${{ github.run_id }}
      DRINKS_STORAGE: supabase
      DRINKS_TTS: edge
      IMAGE_PROVIDER: reuse
      VIDEO_PROVIDER: placeholder
      TTS_PROVIDER: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk
      - run: python -m pip install -r engine/requirements.txt
      - name: produce
        run: python -m engine.drinks_produce
