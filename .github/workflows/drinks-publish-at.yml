# 주류 — 예약 게시 시각에 맞춰 발행 워커를 깨운다(2026-11-18). docs/deviation-drinks-publish-at.md
#
# 왜: drinks-publish.yml 의 크론(KST 07:00~23:30 매 30분)은 GitHub 이 실제로는 하루 서너 번만 돌렸다(11-17~18 실측).
#     DB 는 예약 시각보다 2시간 넘게 늦은 게시를 하지 않으므로, 크론만 믿으면 예약이 통째로 빠질 수 있다.
# 어떻게: [예약 게시] 때 이 워크플로를 at=예약 시각(UTC ISO)으로 한 번 부른다. 그 시각까지 기다렸다가 drinks-publish.yml 을 부른다.
#     잡 하나는 최대 6시간이라, 남은 시간이 길면 5시간 40분 기다린 뒤 자기 자신을 같은 at 으로 다시 부른다(이어 달리기).
#     게시 여부는 여전히 DB 가 정한다(승인·예약·시각) — 이 워크플로는 깨우기만 하고 아무것도 올리지 않는다.
# 비밀: 쓰지 않는다. GITHUB_TOKEN 의 workflow_dispatch 는 새 실행을 만들 수 있다(GitHub 예외 규칙).
name: drinks-publish-at

on:
  workflow_dispatch:
    inputs:
      at:
        description: "깨울 시각(UTC ISO, 예: 2026-11-19T09:00:00Z)"
        required: true

permissions:
  contents: read
  actions: write   # 자기 자신·발행 워커를 workflow_dispatch 로 부르는 데만 쓴다

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: wait until the scheduled time, then wake the publish worker
        env:
          AT: ${{ inputs.at }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          at=$(date -u -d "$AT" +%s) || { echo "시각을 읽지 못함: $AT"; exit 1; }
          left=$(( at - $(date -u +%s) ))
          echo "예약 $AT · 남은 초 $left"
          if [ "$left" -lt -7200 ]; then echo "2시간 넘게 지난 예약 — DB 가 게시하지 않으므로 깨우지 않는다"; exit 0; fi
          if [ "$left" -gt 20400 ]; then
            sleep 20400
            gh workflow run drinks-publish-at.yml -R "$REPO" -f at="$AT"
            echo "이어 달리기: 다시 기다린다"
            exit 0
          fi
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          sleep 30
          gh workflow run drinks-publish.yml -R "$REPO" -f step=publish
          echo "발행 워커를 깨웠다"
