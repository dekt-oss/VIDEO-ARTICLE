# 유튜브 쇼츠 성과 수집 (P-V3 승인 이탈) — docs/deviation-youtube-analytics.md
# 최근 N일(기본 7일) 쇼츠 성과를 YouTube Data+Analytics API 로 읽어 Supabase(youtube_analytics)에
# 스냅샷 저장. 대시보드 /analytics 가 읽음. publish.yml 과 동일하게 GitHub Actions 러너에서 돈다
# (로컬에 파이썬 환경을 갖추지 않아도 "실행" 버튼 하나로 돌릴 수 있게).
#
# 트리거: 매일 KST 07:00 크론 + 수동 버튼.
#   ★ 정정(2026-09-28, 운영자 승인 "가능하면 해주세요"): 수동 전용이었더니 **두 달 넘게 아무도 안
#     눌렀다**(마지막 스냅샷 2026-07-19). 그 사이 실사형 전환 뒤 첫 편(조선업, 시청 비율 67.5%)이
#     잘 된 것도 몰랐다 — 무엇이 먹혔는지 모르고 영상을 바꾸고 있었다. 읽기 전용(YouTube 조회)이고
#     한 번에 1분 안쪽이라 매일 돌린다. 수집 창이 최근 7일(YOUTUBE_ANALYTICS_WINDOW_DAYS)이라
#     주 1회로는 쇼츠의 첫 주 곡선을 놓친다.
#
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY,
#   YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET (업로드용 재사용, 폴백),
#   YOUTUBE_ANALYTICS_REFRESH_TOKEN_KO, YOUTUBE_ANALYTICS_REFRESH_TOKEN_EN (조회 전용, 신규).
# 선택: YOUTUBE_ANALYTICS_CLIENT_ID/SECRET — 조회 전용 클라이언트를 따로 쓰고 싶을 때만.
name: analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = KST 07:00

# 크론과 수동 실행이 겹쳐 같은 큐를 두 워커가 처리하지 않게 직렬화한다
# (2026-09-06 추가. c8b46fd 에서 중복 dispatch 로 분이 두 배 나갈 뻔했다).
concurrency:
  group: analytics-worker
  cancel-in-progress: false

# ★ 공개 저장소 대비(2026-09-15): GITHUB_TOKEN 최소 권한. 쓰기가 필요한 잡만 따로 올린다.
permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install engine deps
        # perf_report(하이브리드 분석)의 LLM 문장화를 위해 anthropic 추가.
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv tenacity httpx supabase python-dateutil anthropic google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Collect shorts analytics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN_KO: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN_KO }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN_EN }}
        run: python -m engine.analytics

      - name: Generate performance report (규칙 + LLM 하이브리드)
        # 수집된 시계열/스냅샷으로 '잘된점/잘못된점/개선방향'을 생성해 performance_reports 에 저장.
        # 대시보드 /analytics/report 가 읽는다. LLM 실패 시 규칙 요약으로 폴백(발행 보장).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m engine.perf_report
