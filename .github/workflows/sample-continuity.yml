# 컷 유기성 샘플 1편 제작 (일회성 검증 — 프로덕션 파이프라인과 무관).
#
# 왜 Actions 인가: 샘플 제작에 GEMINI_API_KEY(이미지·Veo)와 ffmpeg 가 필요한데 개발 샌드박스에는
# 둘 다 없다. 러너에는 시크릿이 있고 ffmpeg 를 설치할 수 있다(render.yml 과 같은 구성).
#
# ★ 수동 실행 전용(workflow_dispatch). 크론 없음 — 돌 때마다 이미지·영상 생성비가 나간다.
# ★ Supabase 시크릿을 **일부러 넘기지 않는다.** 이 샘플은 DB 를 읽지도 쓰지도 않으며,
#   키가 없으면 실수로도 쓸 수 없다(지시서 §0-3).
#
# 산출물은 아티팩트로 받는다: ref/ 2장, cuts/ 8장, after/sample.mp4, log.json.
name: sample-continuity

on:
  workflow_dispatch:
    inputs:
      step:
        description: "verify-aspect(9:16 실측) | refs(레퍼런스 2장) | cuts(컷 8장) | video(클립+조립) | all"
        required: false
        default: "refs"
      before_url:
        description: "비교용 기존 mp4 URL (선택 — 대시보드 ⑥에서 복사)"
        required: false
        default: ""
      from_run_id:
        description: "앞 단계 산출물을 이어받을 run id (cuts→video 로 넘어갈 때 필수)"
        required: false
        default: ""
      publish_branch:
        description: "생성물을 커밋·푸시할 브랜치 (비우면 푸시 안 함). 아티팩트를 직접 못 받는 환경에서 산출물을 꺼내는 통로."
        required: false
        default: ""

# ★ 공개 저장소 대비(2026-09-15): GITHUB_TOKEN 최소 권한. 쓰기가 필요한 잡만 따로 올린다.
permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # publish_branch 로 산출물을 푸시하기 위해서만 필요
      # ★ permissions 블록을 쓰는 순간 나머지는 전부 none 이 된다. from_run_id 로 다른 run 의
      #   아티팩트를 받으려면 actions:read 가 반드시 있어야 한다 — 없으면 download-artifact 가
      #   "Resource not accessible by integration" 으로 죽는다(run 30351424145 에서 실제로 겪음).
      actions: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IMAGE_PROVIDER: gemini
      VIDEO_PROVIDER: veo
      TTS_PROVIDER: edge          # 무료 Edge TTS — 나레이션이 기존 버전과 같아야 하므로 유료 불필요
      BEFORE_URL: ${{ github.event.inputs.before_url }}
      STEP: ${{ github.event.inputs.step || 'refs' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # video 단계에서만 ffmpeg 가 필요하다. 이미지 단계는 설치 없이 빨리 끝낸다.
      - name: Install ffmpeg + 한글 폰트
        if: ${{ github.event.inputs.step == 'video' || github.event.inputs.step == 'all' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      # ★ Actions 는 매 실행이 새 체크아웃이라 앞 단계 산출물이 남지 않는다. cuts 를 확인하고
      #   video 로 넘어갈 때 이걸 안 이어받으면 run.py 가 "컷 스틸 없음"으로 중단한다.
      - name: Carry over previous step artifacts
        if: ${{ github.event.inputs.from_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          run-id: ${{ github.event.inputs.from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: scripts/sample_continuity

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # render.yml 과 같은 목록에서 이 샘플에 불필요한 것(anthropic·manim)을 뺀 것.
          pip install python-dotenv tenacity httpx supabase Pillow edge-tts

      # ★ 웹툰 버전 DoD ① — 종횡비가 실제로 9:16 으로 나오는지 실측한다.
      #   개발 샌드박스에는 GEMINI_API_KEY 가 없어 여기서만 확인할 수 있다.
      #   두 후보 필드 형태를 순서대로 호출하고 통과한 것을 알려준다(docs/수정명세서_웹툰버전_v1.md §4).
      - name: Verify 9:16 aspect ratio
        if: ${{ github.event.inputs.step == 'verify-aspect' }}
        run: python -m scripts.verify_image_aspect

      - name: Run sample step
        if: ${{ github.event.inputs.step != 'verify-aspect' }}
        run: python -m scripts.sample_continuity.run --step "$STEP"

      - name: Show ledger
        if: ${{ always() }}
        run: cat scripts/sample_continuity/log.json || echo "(원장 없음)"

      - name: Probe output mp4
        if: ${{ github.event.inputs.step == 'video' || github.event.inputs.step == 'all' }}
        run: |
          f=scripts/sample_continuity/after/sample.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"

      # 생성물은 .gitignore 대상이라 -f 로 강제 추가한다. 판정용 산출물을 꺼내는 통로일 뿐이고,
      # main 에는 올리지 않는다(전용 브랜치). 매번 main 기준으로 새로 만들어 히스토리를 쌓지 않는다.
      - name: Publish artifacts to branch
        if: ${{ github.event.inputs.publish_branch != '' }}
        env:
          BRANCH: ${{ github.event.inputs.publish_branch }}
        run: |
          # ★ 공개 저장소 대비(2026-09-15): 정확히 "main" 만 막던 가드는 "refs/heads/main" 등을 통과시켰다.
          #   전용 접두사 sample/ 로 시작하는 브랜치만 허용한다(허용 목록이 금지 목록보다 안전하다).
          case "$BRANCH" in
            sample/*) ;;
            *) echo "publish_branch 는 sample/ 로 시작해야 한다(받은 값: $BRANCH)"; exit 1;;
          esac
          case "$BRANCH" in *..*|*" "*) echo "잘못된 브랜치 이름"; exit 1;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # ★ 한 번에 여러 glob 을 넘기면 안 된다. 매칭 안 되는 패턴이 하나라도 있으면 git add 가
          #   통째로 실패해 아무것도 스테이징되지 않는다(cuts 만 있고 mp4 가 없는 단계가 정확히 그 경우).
          for p in ref/*.png cuts/*.png after/*.mp4 log.json; do
            git add -f "scripts/sample_continuity/$p" 2>/dev/null || true
          done
          git diff --cached --quiet && { echo "푸시할 산출물 없음"; exit 0; }
          git commit -m "chore: 컷 유기성 샘플 산출물 (step=${STEP}, run ${GITHUB_RUN_ID})"
          git push -f origin "$BRANCH"
          echo "푸시 완료: $BRANCH"

      - name: Upload sample artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sample-continuity-${{ github.event.inputs.step || 'refs' }}
          if-no-files-found: warn
          retention-days: 7   # from_run_id 로 다음 단계가 이어받을 만큼만(공개 저장소, 2026-09-15)
          # ★ 디렉터리 통째로 올린다. glob 목록으로 올리면 매칭된 파일들의 공통 조상이 아티팩트
          #   루트가 되어(예: cuts 만 있으면 루트가 cuts/) 다음 실행에서 받을 때 경로가 어긋난다.
          #   work/ 는 컷별 중간 산출물이라 크고 이어받을 필요도 없어서 뺀다.
          path: |
            scripts/sample_continuity
            !scripts/sample_continuity/work
