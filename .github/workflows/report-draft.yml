name: report-draft

# 리포트 초안 워커 — report_draft_requests 큐의 'queued' 요청을 처리한다(python -m engine.report_draft).
# 논문 draft.yml 의 리포트 미러.
#
# ★ 이 워크플로가 **정본 처리 경로**다(v3 P1 적대적 리뷰 결정). 근거 게이트(§5)·논증 설계(§6)·
#   원문 인용 대조는 engine/report_draft.py 에만 있고 엣지 함수에는 없다. 대시보드
#   [초안 생성] 버튼(web/app/api/report-generate-draft/route.ts)은 큐에 넣기만 하므로,
#   **이 워크플로가 주기적으로 돌지 않으면 버튼이 아무 일도 하지 않는다** — 실제로 그랬다.
#   render.yml·publish.yml·report-video.yml 과 같은 주기(하루 3번)를 쓴다.
# 기본 모델은 gemini(러너 키). claude 로 바꾸려면 inputs + ANTHROPIC_API_KEY Secret.
#
# 필수 Secret: SUPABASE_SERVICE_KEY, GEMINI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      factsheet_model:
        description: "Fact Sheet 추출 모델"
        default: "gemini-2.5-flash"
      script_model:
        description: "대본 합성 모델 (품질 높이려면 claude-opus-4-8 + ANTHROPIC_API_KEY)"
        default: "gemini-2.5-pro"
      selfcheck_model:
        description: "자기검증 모델"
        default: "gemini-2.5-flash"
      compliance_model:
        description: "컴플라이언스 심사관 모델"
        default: "gemini-2.5-flash"
  # 대시보드 버튼은 GITHUB_DISPATCH_TOKEN 으로 즉시 실행된다. 이 크론은 그 토큰이 실패했을 때
  # 요청을 집어가는 안전망이다(다음 시각까지 대기). 큐가 비면 즉시 종료한다
  # (report_draft.poll_once 가 "대기 없음" 로그만 남기고 0 을 반환 — LLM 호출 0회).
  # ★ schedule 은 .github/workflows/queues.yml 로 옮겼다(2026-09-06).
  #   잡 단위 1분 올림 때문에 4개가 각자 크론을 돌면 빈 날에도 월 324분이 나갔다.
  #   workflow_dispatch 는 **반드시 남긴다** — 대시보드 발주 버튼이 이 워크플로를
  #   이름으로 직접 깨운다(web/lib/trigger-render.ts · trigger-publish.ts).

concurrency:
  group: report-draft-worker
  cancel-in-progress: false

# ★ 공개 저장소 대비(2026-09-15): GITHUB_TOKEN 최소 권한. 쓰기가 필요한 잡만 따로 올린다.
permissions:
  contents: read

jobs:
  report-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIMEZONE: "Asia/Seoul"
      # ★ Fact Sheet 추출이 ARIA 에서 리포트 **원문 전문**을 불러 프롬프트에 넣는다
      #   (engine/report_source.py · 작업지시서 영상엔진품질 v3 §4-2). 이 값이 비면 엔진이
      #   fixture 모드로 돌아 전문을 못 구하고 조용히 요약 기반으로 떨어진다 — 수집(report.yml)
      #   에만 넣고 여기 빠뜨리면 "전문 주입을 켰는데 초안은 그대로"가 된다.
      ARIA_MCP_URL: ${{ secrets.ARIA_MCP_URL }}
      ARIA_BASE: ${{ secrets.ARIA_BASE }}
      ARIA_API_KEY: ${{ secrets.ARIA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: python -m pip install -r engine/requirements.txt
      - name: Warn if ARIA not configured (원문 전문 주입 불가)
        run: |
          if [ -z "${ARIA_MCP_URL}" ] && [ -z "${ARIA_BASE}" ]; then
            echo "::warning::ARIA_MCP_URL·ARIA_BASE 미설정 — 리포트 원문 전문을 못 불러옵니다. Fact Sheet 가 요약만 보고 만들어집니다(source_depth=summary_only)."
          fi
      # 진단: 429 가 무료/유료 어느 한도(RPM/RPD/TPM·tier)에 걸렸는지 응답 본문으로 확인.
      # (엔진은 429 본문을 버리므로 여기서 직접 1회 호출해 본문을 로그에 남긴다. 키는 미출력.)
      - name: Gemini quota probe
        # ★ 수동 실행에서만. 크론에서도 돌면 큐가 비어 있어도 매 실행마다 그냥 태운다.
        if: github.event_name == 'workflow_dispatch'
        run: |
          for M in gemini-2.5-flash gemini-2.5-pro; do
            echo "── $M ──"
            curl -sS -o /tmp/resp.json -w "HTTP %{http_code}\n" \
              "https://generativelanguage.googleapis.com/v1beta/models/${M}:generateContent" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -H "content-type: application/json" \
              -d '{"contents":[{"role":"user","parts":[{"text":"ping"}]}],"generationConfig":{"maxOutputTokens":8}}' || true
            # ★ 공개 저장소 대비(2026-09-15): 원 응답 본문을 찍지 않는다 — 429 본문에 GCP 프로젝트 번호가 실린다.
            #   진단에 필요한 상태·코드·쿼터 이름만 뽑는다.
            python3 -c "import json; d=json.load(open('/tmp/resp.json')); e=d.get('error') or {}; q=[v.get('quotaId') for x in e.get('details') or [] for v in x.get('violations') or []]; print('status:', e.get('status') or 'ok', 'code:', e.get('code'), 'quota:', q)" || echo "(응답 해석 실패)"
          done
      - name: Report draft (리포트 초안 큐 처리 — report_draft_requests 폴링)
        env:
          # 러너의 GEMINI_API_KEY(논문 렌더가 쓰는 유료 키)로 돌도록 기본은 gemini.
          # push 트리거는 inputs 가 비므로 || 기본값 필수(빈 문자열 env 방지).
          MODEL_REPORT_FACTSHEET: ${{ inputs.factsheet_model || 'gemini-2.5-flash' }}
          MODEL_REPORT_SCRIPT: ${{ inputs.script_model || 'gemini-2.5-pro' }}
          MODEL_REPORT_SELFCHECK: ${{ inputs.selfcheck_model || 'gemini-2.5-flash' }}
          MODEL_REPORT_COMPLIANCE: ${{ inputs.compliance_model || 'gemini-2.5-flash' }}
          # 논증 단위(설명엔진 v2 §7). 추출과 같은 급이면 충분하다 — 원문을 읽고 단계를
          # 쪼개는 구조화 작업이라 대본 합성만큼의 모델을 쓸 이유가 없다.
          MODEL_REPORT_REASONING: ${{ inputs.factsheet_model || 'gemini-2.5-flash' }}
        run: python -m engine.report_draft
