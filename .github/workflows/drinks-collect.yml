# 주류 공장 B단계 수집 워커 (2026-10-22). docs/deviation-drinks-phase-b.md
#
# 하루 한 번(KST 06:30) 활성 수집원마다 예약 실행을 만들고 처리한다. 대시보드 [지금 수집]·[검증 실행]·
# [실패분 재시도] 는 큐에 실행을 넣고 이 워크플로를 깨운다(GITHUB_DISPATCH_TOKEN 이 있으면).
# ★ 활성 수집원이 0개면 아무 요청도 하지 않는다. 수집원 활성화는 운영자만 한다(자동 활성화 없음).
# ★ LLM·유료 호출 없음. 외부 요청은 engine/drinks_fetch.py 의 안전 요청기만 쓴다.
name: drinks-collect

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: "활성 수집원의 오늘 예약 실행도 만든다(yes/no)"
        default: "no"
  schedule:
    - cron: "30 21 * * *"

concurrency:
  group: drinks-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # 실행 1회 시간 예산 600초 × 최대 12개(활성 수집원 상한) = 120분 + 설치·여유. 중간에 잘리면 임대 만료로 '중단' 처리된다.
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ARXIV_CONTACT: ${{ secrets.ARXIV_CONTACT }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      # 소재 발견(API) 수집원 키. 비어 있으면 그 수집원만 api_key_missing 으로 멈춘다(다른 수집원은 계속).
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      TIMEZONE: "Asia/Seoul"
      WORKER_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r engine/requirements.txt
      - name: collect
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_INPUT: ${{ inputs.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$SCHEDULE_INPUT" = "yes" ]; then
            python -m engine.drinks_collect --schedule
          else
            python -m engine.drinks_collect
          fi
