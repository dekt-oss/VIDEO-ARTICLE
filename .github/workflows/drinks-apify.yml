# 주류 공장 밈 틀 정밀화 워커 (2026-11-02). docs/deviation-drinks-stage3-4.md
#
# 밈 보드 [쓰자] 가 정밀화 요청을 큐에 넣고 이 워크플로를 깨운다(GITHUB_DISPATCH_TOKEN 이 있으면). 예약 실행은 없다 — 클릭 1회 = 실행 1회(기획 v2 §6-1).
# ★ 돈: Apify 실행마다 상한 $0.02(maxTotalChargeUsd) + 영상 분석 모델. 월 상한 $3 은 DB(0070)가 센다. 운영자가 `gh secret set APIFY_TOKEN` 으로 토큰을 넣어야 돈다.
# ★ 남의 영상은 러너의 임시 폴더에서 분석 뒤 지운다. 저장소(버킷)에 올리지 않는다 — 이 워크플로에는 DRINKS_STORAGE 가 없다. 인스타 토큰도 없다(게시 불가).
name: drinks-apify

on:
  workflow_dispatch:

concurrency:
  group: drinks-apify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIMEZONE: "Asia/Seoul"
      WORKER_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r engine/requirements.txt
      - name: refine
        run: python -m engine.drinks_meme_refine --yes --max 3
