name: report

# 리포트 공장 수집·채점 파이프라인 — ARIA 신호 수집 → 4축 채점 → report_daily_batch 재생성.
# 논문 공장 engine.yml 의 리포트 미러. 이게 "오늘의 리포트 후보"(/finance)를 채운다.
# report-draft.yml(초안)·report-video.yml(지시서·렌더)의 앞단.
#
# 필수 Secret: SUPABASE_SERVICE_KEY, ARIA_MCP_URL(라이브 ARIA MCP 엔드포인트), GEMINI_API_KEY.
#   ★ 사용자의 ARIA 는 REST 가 아니라 MCP 서버다. ARIA_MCP_URL(토큰 포함 URL) 을 등록하면 엔진이
#     MCP(streamable HTTP)로 직접 호출한다. 비면 fixture(샘플) 모드로 도므로 라이브 후보를 원하면
#     반드시 등록(docs/deviation-report-factory.md PFD3). ARIA_BASE 는 순수 REST 대안(선택).
#     ANTHROPIC_API_KEY 는 claude 채점 시에만.

on:
  workflow_dispatch:
    inputs:
      score_model:
        description: "리포트 4축 채점 모델 (gemini-* 면 러너 GEMINI 키 사용)"
        default: "gemini-2.5-flash"
      signal_limit:
        description: "ARIA list_signals 상위 N (후보 풀)"
        default: "40"
  schedule:
    # 매일 07:10 KST(22:10 UTC) — 전일 증권사 리포트가 ARIA 에 쌓인 뒤 수집. inputs 없으면 아래 || 기본값.
    - cron: "10 22 * * *"

concurrency:
  group: report-pipeline
  cancel-in-progress: false

# ★ 공개 저장소 대비(2026-09-15): GITHUB_TOKEN 최소 권한. 쓰기가 필요한 잡만 따로 올린다.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 라이브 ARIA 연결(MCP). 비면 fixture(샘플) 모드로 도니 라이브 후보를 위해 반드시 등록.
      ARIA_MCP_URL: ${{ secrets.ARIA_MCP_URL }}
      # 순수 REST ARIA 대안(선택). MCP 미설정 시에만 사용.
      ARIA_BASE: ${{ secrets.ARIA_BASE }}
      ARIA_API_KEY: ${{ secrets.ARIA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIMEZONE: "Asia/Seoul"
      ARIA_SIGNAL_LIMIT: ${{ inputs.signal_limit || '40' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: python -m pip install -r engine/requirements.txt

      - name: Warn if ARIA not configured (fixture fallback)
        run: |
          if [ -z "${ARIA_MCP_URL}" ] && [ -z "${ARIA_BASE}" ]; then
            echo "::warning::ARIA_MCP_URL·ARIA_BASE 모두 미설정 — 엔진이 fixture(샘플) 모드로 돕니다. 라이브 후보를 원하면 ARIA_MCP_URL Secret(ARIA MCP 엔드포인트 URL)을 등록하세요."
          fi

      - name: Collect ARIA signals (리포트 수집)
        run: python -m engine.report_collect

      - name: Score reports + rebuild daily batch (4축 채점 → report_daily_batch)
        env:
          # 러너의 GEMINI 키로 채점(엣지 함수 쿼터와 분리). claude 로 바꾸려면 input + ANTHROPIC_API_KEY.
          MODEL_REPORT_SCORING: ${{ inputs.score_model || 'gemini-2.5-flash' }}
        run: python -m engine.report_score
