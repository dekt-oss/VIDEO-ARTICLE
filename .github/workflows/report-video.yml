# 리포트 영상 워커 (PF2) — 지시서 생성 + mp4 렌더. 논문 render.yml 미러(report_* 큐).
# 클라우드(Edge/Vercel)에서 LLM 지시서 생성은 가능하나 ffmpeg 렌더는 불가 → Actions 러너에서 실행.
#
# 트리거:
#  - workflow_dispatch(대시보드 GITHUB_DISPATCH_TOKEN): mode=directive(지시서 생성) | render(렌더) | poll(둘 다).
#  - schedule(하루 3번, KST 09/15/21): 토큰 미설정·트리거 실패 대비 안전망. 큐 비면 무거운 설치 없이 즉시 종료.
#    ★ */15 에서 낮췄다(2026-08-12, 비용) — 빈 폴링이 잡당 1분으로 과금됐다. 상세는 render.yml 헤더.
#
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY 또는 GEMINI_API_KEY, ELEVENLABS_API_KEY.
name: report-video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "directive(지시서 생성) | render(렌더) | poll(둘 다)"
        required: false
        default: "poll"
  # ★ schedule 은 .github/workflows/queues.yml 로 옮겼다(2026-09-06).
  #   잡 단위 1분 올림 때문에 4개가 각자 크론을 돌면 빈 날에도 월 324분이 나갔다.
  #   workflow_dispatch 는 **반드시 남긴다** — 대시보드 발주 버튼이 이 워크플로를
  #   이름으로 직접 깨운다(web/lib/trigger-render.ts · trigger-publish.ts).

# 논문 render-worker 와 분리 — 두 공장의 렌더가 서로 직렬화되지 않게 별도 그룹.
concurrency:
  group: report-video-worker
  cancel-in-progress: false

# ★ 공개 저장소 대비(2026-09-15): GITHUB_TOKEN 최소 권한. 쓰기가 필요한 잡만 따로 올린다.
permissions:
  contents: read

jobs:
  report-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event.inputs.mode || 'poll' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      # 큐 점검: 지시서 요청(directive) 또는 렌더 잡(render)이 있을 때만 무거운 설치.
      - name: Check report queues
        id: check
        run: |
          cutoff=$(date -u -d '20 minutes ago' '+%Y-%m-%dT%H:%M:%S')
          rq="or=(status.eq.queued,and(status.in.(assets,tts,assembling),updated_at.lt.${cutoff}))"
          dir=$(curl -s "${SUPABASE_URL}/rest/v1/report_directive_requests?select=id&status=eq.queued&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")
          rj=$(curl -s "${SUPABASE_URL}/rest/v1/report_render_jobs?select=id&${rq}&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")
          has_dir=$([ -n "$dir" ] && [ "$dir" != "[]" ] && echo true || echo false)
          has_rj=$([ -n "$rj" ] && [ "$rj" != "[]" ] && echo true || echo false)
          echo "has_dir=$has_dir" >> "$GITHUB_OUTPUT"
          echo "has_rj=$has_rj"   >> "$GITHUB_OUTPUT"
          echo "지시서 대기=$has_dir · 렌더 대기=$has_rj (mode=$MODE)"

      - name: Install engine deps (+ ffmpeg/폰트/manim, 렌더 시에만)
        if: ${{ steps.check.outputs.has_dir == 'true' || steps.check.outputs.has_rj == 'true' }}
        run: |
          python -m pip install --upgrade pip
          # 지시서 생성(python -m engine.report_directive)은 LLM 호출만 — manim 불요.
          pip install python-dotenv tenacity anthropic httpx supabase
          # 렌더(ffmpeg/manim)는 렌더 잡이 있을 때만. ★ manim(manimpango) 은 libpango 시스템 라이브러리가
          #   있어야 빌드된다. 예전엔 manim 을 무조건 설치해 mode=directive(대시보드 지시서 버튼)에서
          #   libpango 없이 빌드하다 실패했다(report-video 잡 사망 → 클라우드 지시서 미생성).
          if [ "${{ steps.check.outputs.has_rj }}" = "true" ] || [ "$MODE" = "render" ] || [ "$MODE" = "poll" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-nanum libcairo2-dev libpango1.0-dev pkg-config
            pip install Pillow edge-tts manim
          fi

      # 지시서 생성(LLM만) — mode=directive|poll 이고 대기 요청이 있을 때.
      - name: Generate report directives
        if: ${{ (env.MODE == 'directive' || env.MODE == 'poll') && steps.check.outputs.has_dir == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 기본은 Gemini — 이 저장소 운영은 Gemini 키로 돈다(report.yml·report-draft.yml 과 동일 관행,
          # 논문 라인 엣지함수 generate-directive 의 기본값도 gemini-2.5-pro). 예전 기본값
          # 'claude-sonnet-4-6' 은 ANTHROPIC_API_KEY 시크릿이 없어 매 요청이
          # "필수 환경변수 누락: anthropic_api_key" 로 죽었다(잡 자체는 성공으로 보임 — 워커가
          # 요청 행에 error 를 적고 정상 종료하기 때문). claude 로 되돌리려면 저장소 변수
          # MODEL_REPORT_DIRECTIVE + ANTHROPIC_API_KEY 시크릿을 함께 넣는다.
          # ★ ANTHROPIC_API_KEY 를 넣어 두면 Gemini 과부하(503) 때 워커가 sonnet 으로 자동
          #   폴백한다(engine/llm._gemini_text). 안 넣어도 동작은 같지만, 과부하가 몇 분씩
          #   가는 날에는 요청이 "503 from gemini" 로 죽는다(실측 2026-08-04 2건).
          # ★ MODEL_DIRECTIVE 가 아니라 **리포트 전용 상수**다(2026-09-19). 논문 지시서가
          #   deepseek-v4-pro 로 옮겨 갈 때 이 경로가 조용히 딸려 갔다 — 재지 않은 경로이고,
          #   여기 출력 상한은 LLM_SCRIPT_MAX_TOKENS(16,384)라 거의 확실히 절단된다.
          MODEL_REPORT_DIRECTIVE: ${{ vars.MODEL_REPORT_DIRECTIVE || 'gemini-2.5-pro' }}
        run: python -m engine.report_directive

      # 렌더(ffmpeg) — mode=render|poll 이고 렌더 잡이 있을 때.
      - name: Render report videos
        if: ${{ !cancelled() && (env.MODE == 'render' || env.MODE == 'poll') && steps.check.outputs.has_rj == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'gemini' }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge' }}
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER || 'veo' }}
        run: python -m engine.report_render
