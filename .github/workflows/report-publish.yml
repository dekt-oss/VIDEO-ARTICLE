# 리포트 유튜브 업로드 워커 — 논문 publish.yml 의 report 미러.
# 대시보드 "유튜브 업로드" 버튼 → report_upload_requests 큐 → 이 워크플로가 소비(engine.report_publish).
#
# 트리거:
#  - workflow_dispatch: 대시보드가 업로드 요청 시 GITHUB_DISPATCH_TOKEN 으로 즉시 트리거.
#  - schedule(하루 3번, KST 09/15/21): 토큰 미설정·트리거 실패 대비 안전망. 큐가 비었으면 즉시 종료.
#    ★ */15 에서 낮췄다(2026-08-12, 비용) — 빈 폴링이 잡당 1분으로 과금됐다. 상세는 render.yml 헤더.
#
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY,
#   YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN_KO.
# ★ 채널 통합(2026-07-30, docs/specs/20260730-report-merge-into-paper-ko.md): 리포트도
#   하루한편 KO 채널로 발행한다. 목적지는 engine/youtube_channels.CHANNEL_REGISTRY 가 정한다.
#   되돌리려면 레지스트리 report_ko 3개 값과 함께 아래 env 를 REPORT_KO 로 복원한다.
# ★ 논문과 동일: 정체 잡 자동 재큐 없음(업로드는 되돌리기 어려운 외부 행위 — 중복 영상 방지).
name: report-publish

on:
  workflow_dispatch:
  # ★ schedule 은 .github/workflows/queues.yml 로 옮겼다(2026-09-06).
  #   잡 단위 1분 올림 때문에 4개가 각자 크론을 돌면 빈 날에도 월 324분이 나갔다.
  #   workflow_dispatch 는 **반드시 남긴다** — 대시보드 발주 버튼이 이 워크플로를
  #   이름으로 직접 깨운다(web/lib/trigger-render.ts · trigger-publish.ts).

concurrency:
  group: report-publish-worker
  cancel-in-progress: false

# ★ 공개 저장소 대비(2026-09-15): GITHUB_TOKEN 최소 권한. 쓰기가 필요한 잡만 따로 올린다.
permissions:
  contents: read

jobs:
  report-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      # 큐에 대기('queued')가 있을 때만 아래 설치·업로드를 한다. 빈 큐면 러너 시간을 거의 안 쓴다.
      - name: Check report upload queue
        id: check
        run: |
          body=$(curl -s "${SUPABASE_URL}/rest/v1/report_upload_requests?select=id&status=eq.queued&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")
          if [ -z "$body" ] || [ "$body" = "[]" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "대기 중인 리포트 업로드 없음 — 설치/폴 건너뜀"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "대기 중인 리포트 업로드 있음 → 업로드 진행"
          fi

      - name: Install engine deps
        if: ${{ steps.check.outputs.has_work == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv tenacity httpx supabase google-api-python-client google-auth

      - name: Poll report upload queue
        if: ${{ steps.check.outputs.has_work == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_KO: ${{ secrets.YOUTUBE_REFRESH_TOKEN_KO }}
        run: python -m engine.report_publish
